name: CI

on:
  push:
    branches: [main]
    tags-ignore: ['v*-dev*']    # release tag 不需要重 build (artifact 已上传)
  pull_request:
    branches: [main]

# 同一 PR 多次 push 时只跑最新的, 旧的取消省时
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-led:
    name: build ${{ matrix.config }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false       # 一个 mod fail 不取消其他, 看清谁挂了
      matrix:
        config:
          - default          # 空 active_mods, 默认 pio run + buildfs (跟 v0.2.0-dev.3 一致)
          - nissan_gtr_r35   # 启用 GT-R 车型 mod, verify example 仍 build
          - bmw_template     # 启用 BMW 模板, verify example 仍 build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # 不开 cache: 'pip' — 本仓没 requirements.txt, setup-python pip cache 算 key 失败.

      - name: Cache PlatformIO core + platform
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      # Source-only 阶段守卫: 没 CORE_VERSION 文件 (清完 dev release 后的状态),
      # fetch_core 必败. 跳过 fetch + build, CI 标绿但显式 log "skipped".
      # 首个正式 release 后, 维护者写 CORE_VERSION → CI 自动恢复 full build.
      - name: Check if .a release available
        id: have_release
        run: |
          if [ -f CORE_VERSION ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "⏭️  No CORE_VERSION file — source-only stage, skipping build."
            echo "   首个 .a release 发布并写 CORE_VERSION 后, 本 CI 自动恢复 build."
          fi

      - name: Fetch raceguard_core (.a + sdk-bundle)
        if: steps.have_release.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./scripts/fetch_core.sh
          ./scripts/fetch_core.sh

      - name: Build firmware (config = ${{ matrix.config }})
        if: steps.have_release.outputs.available == 'true'
        run: |
          if [ "${{ matrix.config }}" = "default" ]; then
            pio run -e round-led-21
          else
            chmod +x ./scripts/build_with_mod.sh
            ./scripts/build_with_mod.sh cars ${{ matrix.config }}
          fi

      - name: Build LittleFS image (default config only)
        if: steps.have_release.outputs.available == 'true' && matrix.config == 'default'
        run: pio run -e round-led-21 -t buildfs

      - name: Report sizes
        if: steps.have_release.outputs.available == 'true'
        run: |
          echo "=== firmware.bin (${{ matrix.config }}) ==="
          ls -la .pio/build/round-led-21/firmware.bin
          if [ "${{ matrix.config }}" = "default" ]; then
            echo "=== LittleFS image ==="
            ls -la .pio/build/round-led-21/*.bin | grep -i 'spiffs\|littlefs' || true
          fi

  # Summary job: matrix 全过才通过. Branch Protection 配这个固定 job name 作为 required check.
  # 这样未来 matrix 加 config 不需要改 Branch Protection settings.
  build-summary:
    name: build round-led-21 + buildfs
    needs: build-led
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify all matrix builds passed
        run: |
          if [ "${{ needs.build-led.result }}" != "success" ]; then
            echo "❌ One or more matrix builds failed"
            exit 1
          fi
          echo "✅ All matrix builds passed"
