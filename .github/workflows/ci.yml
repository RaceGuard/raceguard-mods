name: CI

on:
  push:
    branches: [main]
    tags-ignore: ['v*-dev*']    # release tag 不需要重 build (artifact 已上传)
  pull_request:
    branches: [main]

# 同一 PR 多次 push 时只跑最新的, 旧的取消省时
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-led:
    name: build round-led-21 + buildfs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache PlatformIO core + platform
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO Core
        run: |
          pip install --upgrade platformio

      - name: Fetch raceguard_core (.a + headers from latest release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 拉 latest release (CI 跑 main / PR 都用最新发布的 .a verify)
          # 注: tag 名要跟 release 一致, 如果新版本不一致需要更新此处
          chmod +x ./scripts/fetch_core.sh
          ./scripts/fetch_core.sh

      - name: Build firmware (pio run)
        run: pio run -e round-led-21

      - name: Build LittleFS image (pio run -t buildfs)
        run: pio run -e round-led-21 -t buildfs

      - name: Report sizes
        run: |
          echo "=== firmware.bin ==="
          ls -la .pio/build/round-led-21/firmware.bin
          echo "=== LittleFS image ==="
          ls -la .pio/build/round-led-21/*.bin | grep -i 'spiffs\|littlefs' || true
