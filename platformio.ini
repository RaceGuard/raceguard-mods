; PlatformIO 配置 - RaceGuard mods
;
; 编译流程:
;   1. ./scripts/fetch_core.sh         拉预编译核心库到 lib/raceguard_core/
;   2. pio run -e round-led-21         编 firmware
;   3. pio run -e round-led-21 -t upload  烧到 ESP32
;
; ⚠️ v0.0.x: 本配置尚不能 build. 需等 v0.1.0 release 核心库上传到 GitHub Releases.
;
; 详见 README.md "快速上手".

[common]
platform = espressif32@6.5.0
framework = arduino
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200

[env:round-led-21]
; ============================================================================
; Waveshare ESP32-S3 Touch LCD 2.1 (480×480 RGB, ST7701S)
; ============================================================================
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = partitions_16mb_lfs.csv
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
; v0.2.0+ 主题包走 LittleFS (PIO 默认 SPIFFS, 必须显式覆盖)
; data/ 目录烧 littlefs partition (4MB), pio run -t uploadfs 触发
board_build.filesystem = littlefs
framework = ${common.framework}
upload_speed = 1152000
monitor_speed = ${common.monitor_speed}

build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DBOARD_HAS_PSRAM
	-DDISPLAY_TYPE_LED
	-DPLATFORM_NAME=\"Waveshare-ESP32-S3-2.1\"
	-DLED_SCREEN_DIAMETER=480
	-DLED_SCREEN_CENTER_X=240
	-DLED_SCREEN_CENTER_Y=240
	-DSD_CHIP_SELECT_MODE=1
	-DLV_LVGL_H_INCLUDE_SIMPLE
	-DLV_CONF_INCLUDE_SIMPLE
	; lv_conf.h 来自 fetch_core 拉的 SDK bundle (lib/raceguard_core/lv_conf.h),
	; 跟 .a 强 ABI 一致 — 别在 include/ 里再放副本, 会跟 .a 漂移导致 link 失败.
	-Ilib/raceguard_core
	-Iinclude
	-Ilib/raceguard_core/include

lib_deps =
	adafruit/SdFat - Adafruit Fork@^2.2.54
	bitbank2/unzipLIB@^1.0.0
	adafruit/Adafruit GFX Library@^1.11.9
	adafruit/Adafruit BusIO@^1.14.5
	; v0.2.1+: 精确锁到 SDK bundle 的 BUILD_INFO.txt 暴露的 .a 编时 LVGL 版本.
	; 跟主仓 .a 编时严格一致, 不靠 "8.x minor ABI 兼容" 运气. 主仓 .a 升级
	; LVGL 时本行随新 release 的 BUILD_INFO.txt 同步更新.
	lvgl/lvgl@8.4.0
	bitbank2/JPEGDEC@^1.2.12
	bitbank2/PNGdec@^1.0.3
	; Arduino ESP32 builtin lib (核心库 .a 内部用 WebServer/BLE/Update 等,
	; 必须显式声明让 PIO LDF 链接 Arduino framework 自带的这些 lib)
	WiFi
	WebServer
	FS
	LittleFS
	BLE
	Update
	Preferences
	Wire
	SPI
	ESPmDNS

; 核心库链接 - fetch_core.sh 下载 .a 到 lib/raceguard_core/ 后, 用 extra_scripts
; 在 link 命令里追加 .a 路径. (PIO 不会自动 link lib/ 下的 .a, 必须显式声明)
extra_scripts = post:scripts/link_core.py

build_src_filter = +<*>

